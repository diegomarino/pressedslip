<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Riddle — pressedslip example</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
      button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
      #preview { display: block; margin-top: 1rem; max-width: 100%; image-rendering: pixelated; border: 1px solid #ddd; }
      #status { margin-top: 0.5rem; font-family: monospace; font-size: 0.85rem; color: #555; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <h1>Riddle</h1>
    <p>Same <code>qaPair</code> block as <code>dad-joke</code>, but the theme overrides <code>textStyles.answer.rotate = 180</code> so the reader has to flip the paper. The cleverness is in the theme, not a new block.</p>
    <div id="status">Rendering…</div>
    <img id="preview" alt="" />
    <a id="download" hidden>Download PNG</a>
    <script type="module">
      import {
        builtinBlocks,
        createRegistry,
        defineTheme,
        loadThemeFonts,
        render,
        themes,
      } from "https://esm.sh/pressedslip@latest/browser";

      const riddles = [
        { question: "I speak without a mouth and hear without ears. I have no body, but I come alive with the wind. What am I?", answer: "An echo." },
        { question: "The more you take, the more you leave behind. What are they?", answer: "Footsteps." },
        { question: "I'm tall when I'm young, and I'm short when I'm old. What am I?", answer: "A candle." },
        { question: "What has hands but cannot clap?", answer: "A clock." },
        { question: "What has a head and a tail but no body?", answer: "A coin." },
        { question: "What gets wetter the more it dries?", answer: "A towel." },
        { question: "I have keys but no locks. I have space but no room. You can enter, but you can't go inside. What am I?", answer: "A keyboard." },
        { question: "What has many teeth but cannot bite?", answer: "A comb." },
        { question: "What can travel around the world while staying in a corner?", answer: "A postage stamp." },
        { question: "The more there is, the less you see. What is it?", answer: "Darkness." },
        { question: "What has cities but no houses, forests but no trees, and rivers but no water?", answer: "A map." },
        { question: "I'm light as a feather, yet the strongest person can't hold me for long. What am I?", answer: "A breath." },
        { question: "What goes up but never comes down?", answer: "Your age." },
        { question: "What has one eye but cannot see?", answer: "A needle." },
        { question: "What can you catch but not throw?", answer: "A cold." },
        { question: "Forward I'm heavy, backward I'm not. What am I?", answer: "The word 'ton'." },
        { question: "What has a neck but no head?", answer: "A bottle." },
        { question: "I have branches, but no fruit, trunk, or leaves. What am I?", answer: "A bank." },
        { question: "What is full of holes but still holds water?", answer: "A sponge." },
        { question: "What word becomes shorter when you add two letters to it?", answer: "Short." },
      ];

      function dayOfYear(now = new Date()) {
        const start = Date.UTC(now.getUTCFullYear(), 0, 0);
        return Math.floor((now.getTime() - start) / 86_400_000);
      }

      const statusEl = document.getElementById("status");
      const previewEl = document.getElementById("preview");
      const downloadEl = document.getElementById("download");

      async function generate() {
        statusEl.textContent = "Loading theme + wasm…";
        const pick = riddles[dayOfYear() % riddles.length];
        const today = new Date().toISOString().slice(0, 10);

        const riddleTheme = defineTheme({
          ...themes.default,
          id: "riddle-rotated",
          shell: {
            ...themes.default.shell,
            textStyles: { answer: { rotate: 180 } },
          },
        });

        const registry = createRegistry(builtinBlocks);
        const theme = await loadThemeFonts(riddleTheme);
        const wasm = fetch("https://esm.sh/@resvg/resvg-wasm/index_bg.wasm");

        statusEl.textContent = "Rendering…";
        const { bytes } = await render(
          {
            id: `riddle-${today}`,
            version: 1,
            date: today,
            status: "ready",
            slots: [
              {
                index: 0,
                blockType: "qaPair",
                data: { question: pick.question, answer: pick.answer },
                title: "Riddle of the day",
              },
            ],
          },
          { registry, theme, wasm },
        );

        const blob = new Blob([bytes], { type: "image/png" });
        const url = URL.createObjectURL(blob);
        previewEl.src = url;
        downloadEl.href = url;
        downloadEl.download = `riddle-${today}.png`;
        downloadEl.hidden = false;
        downloadEl.textContent = "Download PNG";
        statusEl.textContent = pick.question;
      }

      generate().catch((err) => {
        statusEl.textContent = `Error: ${String(err)}`;
        console.error(err);
      });
    </script>
  </body>
</html>
