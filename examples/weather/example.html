<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Weather — pressedslip example</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
      button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
      #preview { display: block; margin-top: 1rem; max-width: 100%; image-rendering: pixelated; border: 1px solid #ddd; }
      #status { margin-top: 0.5rem; font-family: monospace; font-size: 0.85rem; color: #555; min-height: 1.2em; }
      label { display: block; margin-top: 0.5rem; }
      input { font-family: monospace; padding: 0.25rem; }
    </style>
  </head>
  <body>
    <h1>Weather</h1>
    <p>Live <a href="https://open-meteo.com">Open-Meteo</a> fetch with 5s timeout + hardcoded fallback. Custom block defined inline with an inline SVG icon. JSX-free in the browser (uses <code>React.createElement</code>).</p>
    <p><small>Edit lat/lon to render a different location — the preview re-renders automatically.</small></p>
    <label>Latitude <input id="lat" type="number" step="0.0001" value="40.4168" /></label>
    <label>Longitude <input id="lon" type="number" step="0.0001" value="-3.7038" /></label>
    <div id="status">Rendering…</div>
    <img id="preview" alt="" />
    <a id="download" hidden>Download PNG</a>
    <script type="module">
      import {
        builtinBlocks,
        createRegistry,
        defineBlock,
        loadThemeFonts,
        render,
        themes,
      } from "https://esm.sh/pressedslip@latest/browser";
      import React from "https://esm.sh/react@19";
      import { z } from "https://esm.sh/zod@4";

      const h = React.createElement;

      const weatherSchema = z.object({
        tempC: z.number(),
        condition: z.enum(["clear", "clouds", "rain", "snow", "storm"]),
        windKph: z.number(),
        location: z.string(),
      });

      // SVG paths lifted from marplanner's weather block (hand-drawn originals).
      function weatherIcon(condition) {
        if (condition === "clear") {
          return h("svg", { width: 72, height: 72, viewBox: "0 0 72 72" },
            h("circle", { cx: 36, cy: 36, r: 14, fill: "black" }),
            h("g", { stroke: "black", strokeWidth: 5, strokeLinecap: "round" },
              h("line", { x1: 36, y1: 4, x2: 36, y2: 16 }),
              h("line", { x1: 36, y1: 56, x2: 36, y2: 68 }),
              h("line", { x1: 4, y1: 36, x2: 16, y2: 36 }),
              h("line", { x1: 56, y1: 36, x2: 68, y2: 36 }),
              h("line", { x1: 13, y1: 13, x2: 21, y2: 21 }),
              h("line", { x1: 51, y1: 51, x2: 59, y2: 59 }),
              h("line", { x1: 13, y1: 59, x2: 21, y2: 51 }),
              h("line", { x1: 51, y1: 21, x2: 59, y2: 13 }),
            ),
          );
        }
        if (condition === "rain" || condition === "storm") {
          return h("svg", { width: 72, height: 72, viewBox: "0 0 72 72" },
            h("path", { d: "M20 40h32c7 0 12-5 12-12s-5-12-12-12c-3-8-10-12-18-12-11 0-20 8-21 19C6 25 2 30 2 36C6 38 12 40 20 40z", fill: "black" }),
            h("g", { stroke: "black", strokeWidth: 5, strokeLinecap: "round" },
              h("line", { x1: 24, y1: 52, x2: 18, y2: 66 }),
              h("line", { x1: 40, y1: 52, x2: 34, y2: 66 }),
              h("line", { x1: 56, y1: 52, x2: 50, y2: 66 }),
            ),
          );
        }
        if (condition === "snow") {
          return h("svg", { width: 72, height: 72, viewBox: "0 0 72 72" },
            h("path", { d: "M20 38h32c7 0 12-5 12-12s-5-12-12-12c-3-8-10-12-18-12-11 0-20 8-21 19C6 23 2 28 2 34C6 36 12 38 20 38z", fill: "black" }),
            h("g", { fill: "black" },
              h("circle", { cx: 22, cy: 58, r: 4 }),
              h("circle", { cx: 38, cy: 58, r: 4 }),
              h("circle", { cx: 54, cy: 58, r: 4 }),
            ),
          );
        }
        return h("svg", { width: 72, height: 72, viewBox: "0 0 72 72" },
          h("path", { d: "M20 46h32c7 0 12-5 12-12s-5-12-12-12c-3-8-10-12-18-12-11 0-20 8-21 19C6 31 2 36 2 42C6 44 12 46 20 46z", fill: "black" }),
        );
      }

      const weatherBlock = defineBlock({
        type: "weather",
        schema: weatherSchema,
        render: ({ data }) => h("div", {
          style: { width: "100%", padding: 12, display: "flex", flexDirection: "row", alignItems: "center", gap: 16 },
        },
          weatherIcon(data.condition),
          h("div", { style: { display: "flex", flexDirection: "column", gap: 4 } },
            h("div", { style: { fontSize: 48, fontWeight: 700 } }, `${Math.round(data.tempC)}°C`),
            h("div", { style: { fontSize: 16 } }, `${data.location} · wind ${Math.round(data.windKph)} km/h`),
          ),
        ),
        shell: { showTitle: true, separator: "thin", padding: "normal" },
      });

      function wmoToCondition(code) {
        if (code === 0) return "clear";
        if (code >= 1 && code <= 3) return "clouds";
        if (code === 45 || code === 48) return "clouds";
        if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return "rain";
        if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86)) return "snow";
        if (code >= 95) return "storm";
        return "clouds";
      }

      const FALLBACK = { tempC: 20, condition: "clear", windKph: 5, location: "Sample (Madrid)" };

      async function fetchWeather(lat, lon) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);
        try {
          const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;
          const resp = await fetch(url, { signal: controller.signal });
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const json = await resp.json();
          const cw = json.current_weather;
          if (!cw) throw new Error("missing current_weather");
          return { tempC: cw.temperature, condition: wmoToCondition(cw.weathercode), windKph: cw.windspeed, location: `${lat.toFixed(2)},${lon.toFixed(2)}` };
        } catch (err) {
          console.warn(`[weather] fetch failed (${String(err)}); using fallback sample`);
          return FALLBACK;
        } finally {
          clearTimeout(timeoutId);
        }
      }

      const statusEl = document.getElementById("status");
      const previewEl = document.getElementById("preview");
      const downloadEl = document.getElementById("download");

      async function generate() {
        statusEl.textContent = "Fetching weather…";
        const lat = Number(document.getElementById("lat").value);
        const lon = Number(document.getElementById("lon").value);
        const data = await fetchWeather(lat, lon);

        statusEl.textContent = `Loading theme + wasm… (${data.condition} ${Math.round(data.tempC)}°C)`;
        const today = new Date().toISOString().slice(0, 10);
        const registry = createRegistry([...builtinBlocks, weatherBlock]);
        const theme = await loadThemeFonts(themes.default);
        const wasm = fetch("https://esm.sh/@resvg/resvg-wasm/index_bg.wasm");

        const { bytes } = await render(
          {
            id: `weather-${today}`,
            version: 1,
            date: today,
            status: "ready",
            slots: [{ index: 0, blockType: "weather", data, title: "Weather" }],
          },
          { registry, theme, wasm },
        );

        const blob = new Blob([bytes], { type: "image/png" });
        const url = URL.createObjectURL(blob);
        previewEl.src = url;
        downloadEl.href = url;
        downloadEl.download = `weather-${today}.png`;
        downloadEl.hidden = false;
        downloadEl.textContent = "Download PNG";
        statusEl.textContent = `${data.condition} · ${Math.round(data.tempC)}°C · ${data.location}`;
      }

      // Debounce re-renders while the user is typing into lat/lon.
      let debounceId;
      function scheduleGenerate() {
        clearTimeout(debounceId);
        debounceId = setTimeout(() => {
          generate().catch((err) => {
            statusEl.textContent = `Error: ${String(err)}`;
            console.error(err);
          });
        }, 400);
      }
      document.getElementById("lat").addEventListener("input", scheduleGenerate);
      document.getElementById("lon").addEventListener("input", scheduleGenerate);

      generate().catch((err) => {
        statusEl.textContent = `Error: ${String(err)}`;
        console.error(err);
      });
    </script>
  </body>
</html>
