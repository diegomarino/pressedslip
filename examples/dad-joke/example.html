<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dad Joke — pressedslip example</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
      button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
      #preview { display: block; margin-top: 1rem; max-width: 100%; image-rendering: pixelated; border: 1px solid #ddd; }
      #status { margin-top: 0.5rem; font-family: monospace; font-size: 0.85rem; color: #555; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <h1>Dad Joke</h1>
    <p>Picks today's joke by day-of-year and renders it through the built-in <code>qaPair</code> block. Pure composition; no theme override.</p>
    <div id="status">Rendering…</div>
    <img id="preview" alt="" />
    <a id="download" hidden>Download PNG</a>
    <script type="module">
      import {
        builtinBlocks,
        createRegistry,
        loadThemeFonts,
        render,
        themes,
      } from "https://esm.sh/pressedslip@latest/browser";

      const jokes = [
        { setup: "Why don't skeletons fight each other?", punchline: "They don't have the guts." },
        { setup: "I'm reading a book about anti-gravity.", punchline: "It's impossible to put down." },
        { setup: "Why did the scarecrow get promoted?", punchline: "He was outstanding in his field." },
        { setup: "What do you call cheese that isn't yours?", punchline: "Nacho cheese." },
        { setup: "I told my wife she was drawing her eyebrows too high.", punchline: "She looked surprised." },
        { setup: "Why don't scientists trust atoms?", punchline: "Because they make up everything." },
        { setup: "What did the ocean say to the shore?", punchline: "Nothing, it just waved." },
        { setup: "How do you organize a space party?", punchline: "You planet." },
        { setup: "I used to hate facial hair.", punchline: "Then it grew on me." },
        { setup: "Why did the bicycle fall over?", punchline: "It was two tired." },
        { setup: "What do you call a fake noodle?", punchline: "An impasta." },
        { setup: "I would tell you a chemistry joke, but I know I wouldn't get a reaction.", punchline: "Maybe a tepid one." },
        { setup: "Why don't eggs tell jokes?", punchline: "They'd crack each other up." },
        { setup: "What's brown and sticky?", punchline: "A stick." },
        { setup: "Why did the math book look sad?", punchline: "It had too many problems." },
        { setup: "I'm on a seafood diet.", punchline: "I see food and I eat it." },
        { setup: "How do you make a tissue dance?", punchline: "Put a little boogie in it." },
        { setup: "What do you call a bear with no teeth?", punchline: "A gummy bear." },
        { setup: "Why did the coffee file a police report?", punchline: "It got mugged." },
        { setup: "Did you hear about the kidnapping at the playground?", punchline: "They woke up." },
        { setup: "I'm afraid of speed bumps.", punchline: "But I'm slowly getting over it." },
        { setup: "Why did the cookie go to the doctor?", punchline: "Because it was feeling crumby." },
        { setup: "What do you call a sleeping bull?", punchline: "A bulldozer." },
        { setup: "I told my dog a joke about a tail.", punchline: "He didn't get it — too long." },
        { setup: "Why don't oysters share their pearls?", punchline: "Because they're shellfish." },
        { setup: "How does a penguin build its house?", punchline: "Igloos it together." },
        { setup: "What did the grape do when it got stepped on?", punchline: "Nothing, it just let out a little wine." },
        { setup: "Why did the golfer bring two pairs of pants?", punchline: "In case he got a hole in one." },
        { setup: "I asked the librarian if they had books about paranoia.", punchline: "She whispered, 'They're right behind you.'" },
        { setup: "What does a clock do when it's hungry?", punchline: "It goes back four seconds." },
      ];

      function dayOfYear(now = new Date()) {
        const start = Date.UTC(now.getUTCFullYear(), 0, 0);
        return Math.floor((now.getTime() - start) / 86_400_000);
      }

      const statusEl = document.getElementById("status");
      const previewEl = document.getElementById("preview");
      const downloadEl = document.getElementById("download");

      async function generate() {
        statusEl.textContent = "Loading theme + wasm…";
        const pick = jokes[dayOfYear() % jokes.length];
        const today = new Date().toISOString().slice(0, 10);
        const registry = createRegistry(builtinBlocks);
        const theme = await loadThemeFonts(themes.default);
        const wasm = fetch("https://esm.sh/@resvg/resvg-wasm/index_bg.wasm");

        statusEl.textContent = "Rendering…";
        const { bytes } = await render(
          {
            id: `dad-joke-${today}`,
            version: 1,
            date: today,
            status: "ready",
            slots: [
              {
                index: 0,
                blockType: "qaPair",
                data: { question: pick.setup, answer: pick.punchline },
                title: "Dad joke of the day",
              },
            ],
          },
          { registry, theme, wasm },
        );

        const blob = new Blob([bytes], { type: "image/png" });
        const url = URL.createObjectURL(blob);
        previewEl.src = url;
        downloadEl.href = url;
        downloadEl.download = `dad-joke-${today}.png`;
        downloadEl.hidden = false;
        downloadEl.textContent = "Download PNG";
        statusEl.textContent = pick.setup;
      }

      generate().catch((err) => {
        statusEl.textContent = `Error: ${String(err)}`;
        console.error(err);
      });
    </script>
  </body>
</html>
