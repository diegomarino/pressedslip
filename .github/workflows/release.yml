name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'skip ci') }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter pressedslip-playground exec playwright install --with-deps chromium

      - name: Verify
        env:
          # Bundle-size budget (bytes) consumed by scripts/check-bundle-size.mjs.
          # Sourced from the CHECK_BUNDLE_BYTES repo variable (Settings → Variables,
          # or `gh variable set CHECK_BUNDLE_BYTES`) so the budget can be raised
          # without a PR. Unset → empty string → script falls back to its default.
          CHECK_BUNDLE_BYTES: ${{ vars.CHECK_BUNDLE_BYTES }}
        run: pnpm verify

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: npx semantic-release
