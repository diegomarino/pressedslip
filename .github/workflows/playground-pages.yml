name: Playground Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/playground/**'
      - 'src/**'
      - '.github/workflows/playground-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter pressedslip-playground exec playwright install --with-deps chromium
      - env:
          # Same bundle-size budget override as release.yml — both run `pnpm verify`
          # (→ check-bundle-size.mjs), so both must read the CHECK_BUNDLE_BYTES repo
          # variable or a raised budget would block this deploy while release passes.
          CHECK_BUNDLE_BYTES: ${{ vars.CHECK_BUNDLE_BYTES }}
        run: pnpm verify
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
